<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sevgi için</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#190d22; --plum:#35183b; --rose:#ff5c8a; --blush:#ffd9e2; --gold:#f2c98a;
    --script:"Pinyon Script","Snell Roundhand",cursive;
    --serif:"Cormorant Garamond",Georgia,serif;
  }
  *{box-sizing:border-box;margin:0}
  html{scroll-behavior:smooth}
  body{
    background:radial-gradient(ellipse at 50% 0%,var(--plum),var(--ink) 70%) fixed;
    color:var(--blush);font-family:var(--serif);font-size:1.3rem;line-height:1.6;
  }
  .hero{position:relative;height:100svh;min-height:520px;display:grid;place-items:center;overflow:hidden}
  #heart{position:absolute;inset:0;width:100%;height:100%;touch-action:manipulation}
  .title{position:relative;text-align:center;pointer-events:none;padding:0 1rem}
  .title h1{font:400 clamp(4.5rem,18vw,10rem)/1 var(--script);color:#fff;text-shadow:0 0 30px rgba(255,92,138,.8),0 2px 12px rgba(25,13,34,.6)}
  .title p{max-width:26rem;margin-left:auto;margin-right:auto;font-style:italic;font-size:clamp(1.1rem,3.5vw,1.5rem);margin-top:.5rem;text-shadow:0 1px 8px var(--ink)}
  .hint{position:absolute;bottom:1.5rem;left:0;right:0;text-align:center;font-style:italic;opacity:.7;font-size:1rem}
  main{max-width:34rem;margin:0 auto;padding:4rem 1.5rem 5rem}
  h2{font:400 2.6rem/1.1 var(--script);color:var(--gold);margin-bottom:1.25rem}
  .reasons{list-style:none;padding:0;margin-bottom:4rem}
  .reasons li{padding:.9rem 0 .9rem 2rem;position:relative;border-bottom:1px solid rgba(255,217,226,.15)}
  .reasons li::before{content:"♥";position:absolute;left:0;color:var(--rose)}
  .days{text-align:center;margin-bottom:4rem}
  .days b{display:block;font:400 clamp(4rem,16vw,6.5rem)/1 var(--script);color:var(--rose)}
  .days span{font-style:italic}
  .gift{text-align:center}
  button{
    font:600 1.15rem var(--serif);color:var(--ink);background:var(--blush);border:0;
    padding:.8rem 1.8rem;border-radius:999px;cursor:pointer;transition:transform .2s,background .2s;
  }
  button:hover{background:#fff;transform:scale(1.04)}
  button:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
  .letter{
    max-height:0;overflow:hidden;opacity:0;transition:max-height 1s ease,opacity 1s ease,margin .5s;
    text-align:left;font-style:italic;font-size:1.35rem;
  }
  .letter.open{max-height:40rem;opacity:1;margin-top:2rem}
  .letter p+p{margin-top:1rem}
  .letter .sign{text-align:right;font:400 2.2rem var(--script);color:var(--gold);font-style:normal}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto}}
</style>
</head>
<body>

<section class="hero">
  <canvas id="heart" aria-hidden="true"></canvas>
  <div class="title">
    <h1>Sevgi</h1>
    <p>Bu web site geçici olarak yalnızca Furkan’ın Sevgi’ye olan aşkına rezerve edilmiştir</p>
  </div>
  <div class="hint">kalbe dokun</div>
</section>

<main>
  <div class="days">
    <b id="dayCount">0</b>
    <span>gündür seninleyim</span>
  </div>

  <div class="gift">
    <button id="open" aria-expanded="false" aria-controls="letter">Sana bir şey söyleyeceğim</button>
    <div class="letter" id="letter">
      <!-- Mektubu kendin yaz -->
      <p>Seninle geçen her gün için teşekkür ederim. İyi ki varsın, iyi ki benimlesin.</p>
      <p class="sign">Furkan</p>
    </div>
  </div>
</main>

<script>
// Başlangıç tarihini kendine göre değiştir (YIL-AY-GÜN)
const START = new Date('2026-08-28');
document.getElementById('dayCount').textContent =
  Math.max(0, Math.floor((Date.now() - START) / 864e5));

const btn = document.getElementById('open'), letter = document.getElementById('letter');
btn.addEventListener('click', () => {
  const o = letter.classList.toggle('open');
  btn.setAttribute('aria-expanded', o);
  if (o) { burst(innerWidth / 2, innerHeight / 2, 24); }
});

const cv = document.getElementById('heart'), ctx = cv.getContext('2d');
const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
let W, H, S, dpr, P = [], F = [], mouse = {x: -999, y: -999};

function heartPt(t){
  return [16*Math.sin(t)**3,
          -(13*Math.cos(t) - 5*Math.cos(2*t) - 2*Math.cos(3*t) - Math.cos(4*t))];
}
function setup(){
  dpr = Math.min(devicePixelRatio || 1, 2);
  const r = cv.getBoundingClientRect();
  W = r.width; H = r.height;
  cv.width = W*dpr; cv.height = H*dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  S = Math.min(W/40, H/34);
  const n = W < 600 ? 700 : 1300;
  P = [];
  for(let i=0;i<n;i++){
    const t = Math.random()*Math.PI*2;
    const [bx,by] = heartPt(t);
    const k = i % 3 === 0 ? 1 : Math.sqrt(Math.random());
    P.push({
      hx: bx*k, hy: by*k,
      x: Math.random()*W, y: Math.random()*H, vx:0, vy:0,
      r: Math.random()*1.8 + .6,
      c: Math.random() < .25 ? '#ffd9e2' : (Math.random() < .5 ? '#ff5c8a' : '#e0316a')
    });
  }
}
function burst(x,y,n=8){
  for(let i=0;i<n;i++) F.push({
    x, y, vx:(Math.random()-.5)*3, vy:-Math.random()*2.5-1,
    s:Math.random()*18+12, a:1, c:Math.random()<.5?'#ff5c8a':'#ffd9e2'
  });
}
function frame(ts){
  const t = ts/1000;
  const beat = still ? 1 : 1 + .045*Math.max(0, Math.sin(t*3.4))**3 + .02*Math.sin(t*1.7);
  const cx = W/2, cy = H/2 - S*.5;
  ctx.clearRect(0,0,W,H);
  for(const p of P){
    const tx = cx + p.hx*S*beat, ty = cy + p.hy*S*beat;
    p.vx += (tx-p.x)*.03; p.vy += (ty-p.y)*.03;
    const dx = p.x-mouse.x, dy = p.y-mouse.y, d2 = dx*dx+dy*dy;
    if(d2 < 6400){ const f = (80-Math.sqrt(d2))/80*2.2, d = Math.sqrt(d2)||1; p.vx += dx/d*f; p.vy += dy/d*f; }
    p.vx *= .86; p.vy *= .86;
    p.x += p.vx; p.y += p.vy;
    ctx.fillStyle = p.c;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,6.283); ctx.fill();
  }
  for(let i=F.length-1;i>=0;i--){
    const f = F[i];
    f.x += f.vx; f.y += f.vy; f.a -= .008;
    if(f.a <= 0){ F.splice(i,1); continue; }
    ctx.globalAlpha = f.a; ctx.fillStyle = f.c;
    ctx.font = f.s + 'px serif'; ctx.fillText('♥', f.x, f.y);
    ctx.globalAlpha = 1;
  }
  requestAnimationFrame(frame);
}
function pos(e){ const r = cv.getBoundingClientRect(), p = e.touches ? e.touches[0] : e; return {x:p.clientX-r.left, y:p.clientY-r.top}; }
cv.addEventListener('pointermove', e => { mouse = pos(e); });
cv.addEventListener('pointerleave', () => { mouse = {x:-999,y:-999}; });
cv.addEventListener('pointerdown', e => { const p = pos(e); burst(p.x, p.y, 10); });
addEventListener('resize', setup);
setup();
requestAnimationFrame(frame);
</script>
</body>
</html>
